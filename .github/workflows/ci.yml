name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch: {}

# Cancels a superseded run when a new commit lands on the same PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  lint-test-build:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    # Recurring failure mode this guards against: "Install Playwright
    # browsers" hanging on a flaky download/apt mirror with no caching to
    # fall back on, sitting silently for hours against the platform's
    # default 360-minute job timeout instead of failing fast so a retry can
    # succeed. 15 min comfortably covers a real (cached or fresh) run.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Without this, every run re-downloads Chromium + its OS deps from
      # scratch — slow, and the main source of the hangs the timeout above
      # guards against. Keyed on the lockfile so a Playwright version bump
      # invalidates the cache automatically.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 7
          # Diagnostic-only: HTML traces/screenshots from the failed run,
          # never .env files or other local runtime config.
          if-no-files-found: ignore
